name: Documentation
description: Improve README, architecture notes, guides, or roadmap docs
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What documentation should be added or updated?
      description: Describe the missing, outdated, or unclear documentation.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Target file(s) or section
      placeholder: e.g. README.md, PROGRESS.md, AGENTS.md
    validations:
      required: false
