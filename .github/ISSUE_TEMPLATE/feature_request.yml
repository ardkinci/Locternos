name: Feature Request
description: Suggest an improvement or new idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, mockups, or alternatives considered (optional).
    validations:
      required: false
